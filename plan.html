<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt's Reverse Deadline Planner</title>
    <meta name="theme-color" content="#1e1b4b">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-180.png">

    <style>
        :root {
            --purple-200: #ddd6fe;
            --purple-300: #c4b5fd;
            --green: #86efac;
            --yellow: #fde047;
            --red: #fca5a5;
            --red-strong: #f87171;
            --glass: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        }

        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #312e81 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
        :focus-visible { outline: 2px solid var(--purple-300); outline-offset: 2px; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }

        .input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-family: inherit;
            font-size: 16px; /* keeps iOS from zooming in on focus */
        }
        .input:focus {
            outline: none;
            border-color: rgba(167, 139, 250, 0.5);
            background: rgba(0, 0, 0, 0.4);
        }
        .input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

        .app { max-width: 500px; margin: 0 auto; padding: 16px 16px 80px; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; }
        .title { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin: 0; }
        .title .accent { color: var(--purple-300); }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .bell { display: flex; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.4); transition: color .15s, background-color .15s; }
        .bell:hover { color: rgba(255,255,255,0.7); }
        .bell.on { background: rgba(250, 204, 21, 0.2); color: var(--yellow); }
        .clock { text-align: right; }
        .clock-time { font-size: 30px; font-weight: 700; line-height: 1; }
        .caption { font-size: 12px; color: var(--purple-200); opacity: 0.7; }

        /* Deadline + buffer */
        .settings { border-radius: 16px; padding: 16px; margin-bottom: 16px; display: flex; gap: 16px; }
        .settings .grow { flex: 1; min-width: 0; }
        .settings .buffer { width: 96px; }
        .settings .input { width: 100%; border-radius: 8px; padding: 8px; text-align: center; font-size: 18px; }
        .label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--purple-200); margin-bottom: 4px; }
        .label .day { text-transform: none; color: var(--yellow); }

        /* Status panel */
        .status {
            border-radius: 16px; padding: 20px; margin-bottom: 24px;
            border-left: 4px solid var(--tone);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            transition: background-color .5s, border-color .5s;
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
        }
        .tone-green { --tone: #4ade80; --tone-text: var(--green); }
        .tone-yellow { --tone: #facc15; --tone-text: var(--yellow); }
        .tone-red { --tone: #ef4444; --tone-text: var(--red); background: rgba(127, 29, 29, 0.2); }
        .status.all-done.tone-green { background: rgba(20, 83, 45, 0.2); }
        .eyebrow { font-size: 12px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .status-line { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--tone-text); }
        .status-sub { font-size: 12px; margin-top: 4px; }
        .status-sub.ahead { color: rgba(187, 247, 208, 0.8); }
        .status-sub.behind { color: rgba(254, 240, 138, 0.8); }
        .right { text-align: right; }
        .buffer-left { font-size: 24px; font-weight: 700; }
        .buffer-left.pos { color: var(--green); }
        .buffer-left.neg { color: var(--red-strong); }
        .finished { font-size: 12px; opacity: 0.7; margin-top: 4px; }
        .gate-row { grid-column: 1 / -1; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
        .gate { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .gate-time { font-size: 20px; font-weight: 700; color: var(--yellow); }
        .countdown { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.7); }
        .countdown.soon { color: #fef08a; }
        .countdown.over { color: var(--red); }
        .eta { font-size: 14px; color: var(--purple-200); }

        /* Steps */
        .steps-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 4px; min-height: 24px; }
        .steps-head .label { margin: 0; opacity: 0.7; }
        .reset { font-size: 12px; padding: 4px 10px; border-radius: 6px; display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5); transition: color .15s, background-color .15s; }
        .reset:hover { color: white; background: rgba(255,255,255,0.1); }
        .reset.armed { background: #dc2626; color: white; }

        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task { border-radius: 12px; padding: 12px; border-left: 4px solid #6b7280; opacity: 0.8; transition: all .2s; }
        .task.active { border-left-color: #3b82f6; background: rgba(30, 58, 138, 0.2); transform: scale(1.02); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.25); opacity: 1; outline: 1px solid rgba(59, 130, 246, 0.3); }
        .task.done { border-left-color: #22c55e; background: rgba(20, 83, 45, 0.1); opacity: 0.5; }
        .task.dragging { opacity: 0.4; }
        .task-times { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; margin-bottom: 4px; padding: 0 4px; }
        .task-times .planned { opacity: 0.6; }
        .chip-ok { color: var(--green); }
        .chip-late { color: var(--red); }
        .task-main { display: flex; gap: 8px; align-items: center; }
        .grip { display: flex; padding: 4px; cursor: move; opacity: 0.3; touch-action: none; }
        .grip:hover { opacity: 1; }
        .task-name { flex: 1; min-width: 0; border-radius: 4px; padding: 4px 8px; }
        .task-name.struck { text-decoration: line-through; }
        .dur { position: relative; width: 64px; flex-shrink: 0; }
        .dur .input { width: 100%; border-radius: 4px; padding: 4px 20px 4px 6px; text-align: center; }
        .dur span { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); font-size: 9px; opacity: 0.5; pointer-events: none; }
        .task-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-left: 28px; }
        .tools { display: flex; gap: 4px; }
        .icon-btn { display: flex; padding: 6px; border-radius: 4px; opacity: 0.5; transition: opacity .15s, background-color .15s; }
        .icon-btn:hover { opacity: 1; background: rgba(255,255,255,0.1); }
        .icon-btn.danger { color: var(--red); }
        .icon-btn.danger:hover { background: rgba(239, 68, 68, 0.2); }
        .act { font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 6px; display: flex; align-items: center; gap: 4px; transition: background-color .15s; }
        .act.start { background: #2563eb; }
        .act.start:hover { background: #3b82f6; }
        .act.finish { background: #16a34a; }
        .act.finish:hover { background: #22c55e; }
        .act.restart { background: rgba(255,255,255,0.1); }
        .act.restart:hover { background: rgba(255,255,255,0.2); }

        .add { width: 100%; margin-top: 16px; padding: 12px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; color: rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; transition: all .15s; }
        .add:hover { background: rgba(255,255,255,0.05); color: white; border-color: rgba(255,255,255,0.4); }
        .footer { margin-top: 32px; text-align: center; font-size: 12px; color: rgba(255,255,255,0.3); }

        .toast {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 50;
            width: calc(100% - 32px); max-width: 468px;
            background: rgba(59, 7, 100, 0.92);
            border-radius: 12px; padding: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            display: flex; gap: 12px; align-items: flex-start; text-align: left;
        }
        .toast .icon { color: var(--yellow); margin-top: 2px; flex-shrink: 0; }
        .toast-title { font-weight: 700; font-size: 14px; }
        .toast-body { font-size: 12px; opacity: 0.8; }

        @media (max-width: 400px) {
            .title { font-size: 20px; gap: 6px; }
            .header-right { gap: 8px; }
            .clock-time { font-size: 24px; }
        }

        .fatal { background: rgba(220, 38, 38, 0.9); padding: 20px; margin: 20px; border-radius: 12px; text-align: center; }
    </style>
</head>
<body>
    <div id="root"></div>
    <noscript><div class="fatal">This planner needs JavaScript enabled.</div></noscript>

    </script>

    <script>
        // --- 1. Setup ---
        const { h, render } = preact;
        const { useState, useEffect, useRef } = preactHooks;
        const html = htm.bind(h);

        // --- 2. Icons (path data from Lucide) ---
        const ICONS = {
            Clock: "M12 6v6l4 2 M22 12A10 10 0 1 1 12 2a10 10 0 0 1 10 10z",
            AlertTriangle: "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01",
            CheckCircle: "M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4L12 14.01l-3-3",
            PartyPopper: "M5.8 11.3 2 22l10.7-3.79 M4 3h.01 M22 8h.01 M15 2h.01 M22 20h.01 M22 2l-2.24.75a2.9 2.9 0 0 0-1.96 3v0a2.9 2.9 0 0 0 1.96 3L22 9.5V2z M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2z",
            GripVertical: "M9 12h1 M9 5h1 M9 19h1 M15 12h1 M15 5h1 M15 19h1",
            ArrowUp: "M12 19V5 M5 12l7-7 7 7",
            ArrowDown: "M12 5v14 M19 12l-7 7-7-7",
            Trash2: "M3 6h18 M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6 M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2 M10 11v6 M14 11v6",
            Play: "M5 3l14 9-14 9V3z",
            Check: "M20 6L9 17l-5-5",
            RotateCcw: "M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8 M3 3v5h5",
            Plus: "M12 5v14 M5 12h14",
            Bell: "M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10.3 21a1.94 1.94 0 0 0 3.4 0",
            BellOff: "M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5 M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7 M10.3 21a1.94 1.94 0 0 0 3.4 0 M2 2l20 20"
        };

        const Icon = ({ name, size = 20, className = '' }) => html`
            <svg class=${'icon ' + className} width=${size} height=${size} viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d=${ICONS[name]} />
            </svg>`;

        // --- 3. App Logic ---
        const MIN = 60 * 1000;
        const HOUR = 60 * MIN;
        const STORAGE_KEY = 'deadlinePlannerData_v3';

        const fmtTime = (ms) => {
            const d = new Date(ms);
            return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        };

        const fmtDur = (mins) => {
            const m = Math.abs(mins);
            return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
        };

        const toMins = (ms) => Math.round(ms / MIN);

        // Positive = early (credit), negative = late.
        const earlyLate = (mins) => mins === 0 ? 'on time' : `${fmtDur(mins)} ${mins > 0 ? 'early' : 'late'}`;

        // Pick the occurrence of HH:MM nearest to now (6h back to 18h ahead), so a 01:00
        // deadline set at 23:00 lands tomorrow instead of 22 hours in the past.
        const resolveDeadline = (timeStr, nowMs) => {
            const [h, m] = timeStr.split(':').map(Number);
            const d = new Date(nowMs);
            d.setHours(h, m, 0, 0);
            if (d.getTime() < nowMs - 6 * HOUR) d.setDate(d.getDate() + 1);
            else if (d.getTime() > nowMs + 18 * HOUR) d.setDate(d.getDate() - 1);
            return d.getTime();
        };

        const dayLabel = (ms, nowMs) => {
            const d = new Date(ms); d.setHours(0, 0, 0, 0);
            const t = new Date(nowMs); t.setHours(0, 0, 0, 0);
            const days = Math.round((d - t) / (24 * HOUR));
            if (days === 0) return '';
            if (days === 1) return 'tomorrow';
            if (days === -1) return 'yesterday';
            return d.toLocaleDateString(undefined, { weekday: 'short' });
        };

        const loadSaved = () => {
            const nowMs = Date.now();
            const state = {
                deadline: "17:00",
                deadlineAt: null,
                buffer: 10,
                alertsOn: false,
                tasks: [
                    { id: 1, name: "Research", duration: 30, status: "pending" },
                    { id: 2, name: "Drafting", duration: 45, status: "pending" },
                    { id: 3, name: "Review", duration: 15, status: "pending" }
                ]
            };
            try {
                const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (parsed) {
                    if (parsed.deadline) state.deadline = parsed.deadline;
                    if (parsed.deadlineAt) state.deadlineAt = parsed.deadlineAt;
                    if (parsed.buffer !== undefined) state.buffer = parsed.buffer;
                    if (parsed.alertsOn) state.alertsOn = true;
                    // Older saves have no start times; treat an active step as started now.
                    if (parsed.tasks) state.tasks = parsed.tasks.map(t =>
                        t.status === 'active' && !t.startedAt ? { ...t, startedAt: nowMs } : t);
                }
            } catch (e) {}
            // No saved date (older save) or left over from a previous day: re-anchor to the next occurrence.
            if (!state.deadlineAt || state.deadlineAt < nowMs - 12 * HOUR) {
                state.deadlineAt = resolveDeadline(state.deadline, nowMs);
            }
            return state;
        };

        const stepName = (t) => t.name || 'Untitled step';

        // Service worker: offline support and installability. Only available over http(s), not file://.
        let swReg = null;
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
            navigator.serviceWorker.register('sw.js').then(reg => { swReg = reg; }).catch(() => {});
        }

        // System notification (if permitted) plus a buzz on phones that support it. Android only shows
        // notifications raised through the service worker, so prefer that when it's registered.
        const notify = (title, body) => {
            try {
                if ('Notification' in window && Notification.permission === 'granted') {
                    const opts = { body, tag: 'deadline-planner', renotify: true, icon: 'icon-192.png' };
                    if (swReg) swReg.showNotification(title, opts);
                    else new Notification(title, opts);
                }
            } catch (e) {}
            try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
        };

        const App = () => {
            const [initial] = useState(loadSaved);
            const [deadline, setDeadline] = useState(initial.deadline);
            const [deadlineAt, setDeadlineAt] = useState(initial.deadlineAt);
            const [buffer, setBuffer] = useState(initial.buffer);
            const [tasks, setTasks] = useState(initial.tasks);
            const [nowMs, setNowMs] = useState(Date.now());
            const [dragId, setDragId] = useState(null);
            const [alertsOn, setAlertsOn] = useState(initial.alertsOn);
            const [toast, setToast] = useState(null);
            const [confirmReset, setConfirmReset] = useState(false);
            const firedAlerts = useRef(new Set());

            useEffect(() => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ deadline, deadlineAt, buffer, tasks, alertsOn }));
                } catch (e) {}
            }, [deadline, deadlineAt, buffer, tasks, alertsOn]);

            useEffect(() => {
                const interval = setInterval(() => setNowMs(Date.now()), 5000);
                return () => clearInterval(interval);
            }, []);

            // Planned time gates: work backwards from (deadline - buffer).
            const scheduledTasks = [];
            let gate = deadlineAt - buffer * MIN;
            for (let i = tasks.length - 1; i >= 0; i--) {
                const end = gate;
                gate -= tasks[i].duration * MIN;
                scheduledTasks.unshift({ ...tasks[i], plannedStart: gate, plannedEnd: end });
            }

            // Projection: work forwards from now. The active step ends when its time runs out
            // (or now, if it has overrun); pending steps follow back-to-back in list order.
            const activeTask = scheduledTasks.find(t => t.status === 'active');
            const pendingTasks = scheduledTasks.filter(t => t.status === 'pending');
            const nextTask = activeTask || pendingTasks[0];
            const activeProjectedEnd = activeTask ? Math.max(nowMs, activeTask.startedAt + activeTask.duration * MIN) : null;

            let projectedFinish;
            if (nextTask) {
                projectedFinish = activeTask ? activeProjectedEnd : nowMs;
                pendingTasks.forEach(t => projectedFinish += t.duration * MIN);
            } else {
                const finishes = tasks.map(t => t.completedAt).filter(Boolean);
                projectedFinish = finishes.length ? Math.max(...finishes) : nowMs;
            }

            // Buffer left can exceed the configured buffer: time gained by running early is credit.
            const bufferLeft = toMins(deadlineAt - projectedFinish);
            const vsPlan = bufferLeft - buffer; // positive = ahead of plan
            const tone = bufferLeft < 0 ? 'red' : (nextTask && vsPlan < 0) ? 'yellow' : 'green';

            // The gate you're working towards right now, and how long until it.
            const gateAt = nextTask ? (activeTask ? activeTask.plannedEnd : nextTask.plannedStart) : null;
            const gateMins = nextTask ? toMins(gateAt - nowMs) : 0;
            const countdown = !nextTask ? '' :
                gateMins > 0 ? (activeTask ? `${fmtDur(gateMins)} left` : `in ${fmtDur(gateMins)}`) :
                gateMins === 0 ? 'now' :
                `${fmtDur(gateMins)} ${activeTask ? 'over' : 'overdue'}`;

            // Alerts: 5 minutes before and at the current gate, plus once when the deadline is projected to slip.
            const alerts = [];
            if (activeTask) {
                const name = stepName(activeTask);
                alerts.push({ key: `warn-end-${activeTask.id}-${gateAt}`, at: gateAt - 5 * MIN, title: `5 min left: ${name}`, body: `Finish by ${fmtTime(gateAt)} to stay on plan.` });
                alerts.push({ key: `end-${activeTask.id}-${gateAt}`, at: gateAt, title: `Time's up: ${name}`, body: `This step was due to finish at ${fmtTime(gateAt)}.` });
            } else if (nextTask) {
                const name = stepName(nextTask);
                alerts.push({ key: `warn-start-${nextTask.id}-${gateAt}`, at: gateAt - 5 * MIN, title: `Up next in 5 min: ${name}`, body: `Start by ${fmtTime(gateAt)} to stay on plan.` });
                alerts.push({ key: `start-${nextTask.id}-${gateAt}`, at: gateAt, title: `Start now: ${name}`, body: `This step was due to start at ${fmtTime(gateAt)}.` });
            }
            if (nextTask && bufferLeft < 0) {
                alerts.push({ key: `late-${deadlineAt}`, at: nowMs, title: `Deadline at risk`, body: `On current pace you'll finish at ${fmtTime(projectedFinish)}, ${fmtDur(bufferLeft)} past the deadline.` });
            }

            useEffect(() => {
                if (!alertsOn) return;
                // Skip anything more than 10 minutes stale (e.g. the tab was asleep) rather than firing a backlog.
                const due = alerts.filter(a => a.at <= nowMs && a.at > nowMs - 10 * MIN && !firedAlerts.current.has(a.key));
                due.forEach(a => firedAlerts.current.add(a.key));
                const latest = due[due.length - 1];
                if (latest) {
                    notify(latest.title, latest.body);
                    setToast(latest);
                }
            });

            useEffect(() => {
                if (!toast) return;
                const t = setTimeout(() => setToast(null), 10000);
                return () => clearTimeout(t);
            }, [toast]);

            // Status in the tab title, e.g. "12m left · Drafting · ▲ 5m ahead".
            useEffect(() => {
                let status;
                if (tone === 'red') status = `✗ late ${fmtDur(bufferLeft)}`;
                else if (tone === 'yellow') status = `▼ ${fmtDur(vsPlan)} behind`;
                else status = vsPlan > 0 ? `▲ ${fmtDur(vsPlan)} ahead` : '✓ on track';
                document.title = nextTask
                    ? `${countdown} · ${stepName(nextTask)} · ${status}`
                    : `✓ Done · Deadline Planner`;
            });

            useEffect(() => {
                if (!confirmReset) return;
                const t = setTimeout(() => setConfirmReset(false), 3000);
                return () => clearTimeout(t);
            }, [confirmReset]);

            const toggleAlerts = async () => {
                if (alertsOn) return setAlertsOn(false);
                if ('Notification' in window && Notification.permission === 'default') {
                    try { await Notification.requestPermission(); } catch (e) {}
                }
                setAlertsOn(true);
            };

            // First tap arms, second tap (within 3s) clears all progress and re-anchors the deadline.
            const resetProgress = () => {
                if (!confirmReset) return setConfirmReset(true);
                setTasks(tasks.map(({ startedAt, completedAt, ...t }) => ({ ...t, status: 'pending' })));
                if (deadline) setDeadlineAt(resolveDeadline(deadline, Date.now()));
                firedAlerts.current.clear();
                setConfirmReset(false);
            };
            const hasProgress = tasks.some(t => t.status !== 'pending');

            const addTask = () => setTasks([...tasks, { id: Date.now(), name: "", duration: 15, status: "pending" }]);
            const updateTask = (id, field, value) => setTasks(tasks.map(t => t.id === id ? { ...t, [field]: value } : t));
            const deleteTask = (id) => setTasks(tasks.filter(t => t.id !== id));

            const moveTask = (index, direction) => {
                const newTasks = [...tasks];
                if (direction === -1 && index > 0) {
                    [newTasks[index], newTasks[index - 1]] = [newTasks[index - 1], newTasks[index]];
                } else if (direction === 1 && index < newTasks.length - 1) {
                    [newTasks[index], newTasks[index + 1]] = [newTasks[index + 1], newTasks[index]];
                }
                setTasks(newTasks);
            };

            const setTaskStatus = (id, status) => {
                const now = Date.now();
                setTasks(tasks.map(t => {
                    if (t.id === id) {
                        if (status === 'active') return { ...t, status, startedAt: now, completedAt: undefined };
                        if (status === 'completed') return { ...t, status, completedAt: now };
                        return { ...t, status, startedAt: undefined, completedAt: undefined };
                    }
                    // Only one step can be active; starting another puts the current one back in the queue.
                    if (status === 'active' && t.status === 'active') return { ...t, status: 'pending', startedAt: undefined };
                    return t;
                }));
            };

            // Pointer-based reordering from the grip handle (works with touch as well as mouse).
            const onGripDown = (e, id) => {
                e.preventDefault();
                e.currentTarget.setPointerCapture(e.pointerId);
                setDragId(id);
            };
            const onGripMove = (e) => {
                if (dragId === null) return;
                const row = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-task-id]');
                if (!row || row.dataset.taskId === String(dragId)) return;
                setTasks(prev => {
                    const from = prev.findIndex(t => t.id === dragId);
                    const to = prev.findIndex(t => String(t.id) === row.dataset.taskId);
                    if (from < 0 || to < 0) return prev;
                    const copy = [...prev];
                    copy.splice(to, 0, copy.splice(from, 1)[0]);
                    return copy;
                });
            };
            const onGripUp = () => setDragId(null);

            const deadlineDay = dayLabel(deadlineAt, nowMs);

            const statusLine = !nextTask
                ? html`<${Icon} name="PartyPopper" size=${18} /> All Done!`
                : tone === 'red' ? html`<${Icon} name="AlertTriangle" size=${18} /> Late ${fmtDur(bufferLeft)}`
                : tone === 'yellow' ? html`<${Icon} name="AlertTriangle" size=${18} /> Behind ${fmtDur(vsPlan)}`
                : html`<${Icon} name="CheckCircle" size=${18} /> On Track`;

            return html`
                <div class="app">
                    ${toast && html`
                        <button class="toast glass" role="status" onClick=${() => setToast(null)}>
                            <${Icon} name="Bell" size=${18} />
                            <div>
                                <div class="toast-title">${toast.title}</div>
                                <div class="toast-body">${toast.body}</div>
                            </div>
                        </button>
                    `}

                    <header class="header">
                        <h1 class="title">
                            <${Icon} name="Clock" className="accent" />
                            <span>Deadline<span class="accent">Planner</span></span>
                        </h1>
                        <div class="header-right">
                            <button
                                class=${'bell' + (alertsOn ? ' on' : '')}
                                onClick=${toggleAlerts}
                                title=${alertsOn ? 'Alerts on' : 'Alerts off'}
                                aria-label="Alerts"
                                aria-pressed=${alertsOn ? 'true' : 'false'}
                            >
                                <${Icon} name=${alertsOn ? 'Bell' : 'BellOff'} size=${18} />
                            </button>
                            <div class="clock">
                                <div class="clock-time mono">${fmtTime(nowMs)}</div>
                                <div class="caption">CURRENT TIME</div>
                            </div>
                        </div>
                    </header>

                    <div class="settings glass">
                        <div class="grow">
                            <label class="label" for="deadline">
                                Target Deadline ${deadlineDay && html`<span class="day">(${deadlineDay})</span>`}
                            </label>
                            <input id="deadline" type="time" class="input mono" value=${deadline} onInput=${(e) => {
                                const v = e.target.value;
                                setDeadline(v);
                                if (v) setDeadlineAt(resolveDeadline(v, Date.now()));
                            }} />
                        </div>
                        <div class="buffer">
                            <label class="label" for="buffer">Buffer (m)</label>
                            <input id="buffer" type="number" min="0" inputmode="numeric" class="input mono" value=${buffer}
                                onInput=${(e) => setBuffer(Math.max(0, Number(e.target.value) || 0))} />
                        </div>
                    </div>

                    <section class=${`status glass tone-${tone}${nextTask ? '' : ' all-done'}`} aria-label="Status">
                        <div>
                            <div class="eyebrow">Status</div>
                            <div class="status-line">${statusLine}</div>
                            ${nextTask && tone !== 'red' && vsPlan !== 0 && html`
                                <div class=${'status-sub ' + (vsPlan > 0 ? 'ahead' : 'behind')}>
                                    ${vsPlan > 0 ? `${fmtDur(vsPlan)} ahead of plan` : 'eating into buffer'}
                                </div>
                            `}
                        </div>
                        <div class="right">
                            <div class="eyebrow">Buffer Left</div>
                            <div class=${'buffer-left mono' + (bufferLeft < 0 ? ' neg' : vsPlan > 0 ? ' pos' : '')}>
                                ${bufferLeft < 0 ? '−' : ''}${fmtDur(bufferLeft)}
                            </div>
                            ${!nextTask && html`<div class="finished">finished ${fmtTime(projectedFinish)}</div>`}
                        </div>
                        ${nextTask && html`
                            <div class="gate-row">
                                <div>
                                    <div class="eyebrow">${activeTask ? 'Finish current step by' : 'Start next step by'}</div>
                                    <div class="gate">
                                        <span class="gate-time mono">${fmtTime(gateAt)}</span>
                                        <span class=${'countdown' + (gateMins < 0 ? ' over' : gateMins <= 5 ? ' soon' : '')}>${countdown}</span>
                                    </div>
                                </div>
                                <div class="right">
                                    <div class="eyebrow">Est. Finish</div>
                                    <div class="eta mono">${fmtTime(projectedFinish)}</div>
                                </div>
                            </div>
                        `}
                    </section>

                    <div class="steps-head">
                        <h2 class="label">Steps</h2>
                        ${hasProgress && html`
                            <button class=${'reset' + (confirmReset ? ' armed' : '')} onClick=${resetProgress}>
                                <${Icon} name="RotateCcw" size=${12} /> ${confirmReset ? 'Tap again to reset' : 'Reset all'}
                            </button>
                        `}
                    </div>

                    <div class="task-list">
                        ${scheduledTasks.map((task, index) => {
                            const isCompleted = task.status === 'completed';
                            const isActive = task.status === 'active';
                            const name = stepName(task);
                            const cls = 'task glass' + (isActive ? ' active' : '') + (isCompleted ? ' done' : '') + (dragId === task.id ? ' dragging' : '');

                            // How this step is tracking against its own gate.
                            let progress = null;
                            if (isCompleted && task.completedAt) {
                                const diff = toMins(task.plannedEnd - task.completedAt);
                                progress = { text: `done ${fmtTime(task.completedAt)} · ${earlyLate(diff)}`, ok: diff >= 0 };
                            } else if (isActive) {
                                const diff = toMins(task.plannedEnd - activeProjectedEnd);
                                progress = { text: `ends ${fmtTime(activeProjectedEnd)} · ${earlyLate(diff)}`, ok: diff >= 0 };
                            }

                            return html`
                                <div key=${task.id} data-task-id=${task.id} class=${cls}>
                                    <div class="task-times mono">
                                        <span class="planned">Start: ${fmtTime(task.plannedStart)}</span>
                                        ${progress && html`<span class=${progress.ok ? 'chip-ok' : 'chip-late'}>${progress.text}</span>`}
                                        <span class="planned">End: ${fmtTime(task.plannedEnd)}</span>
                                    </div>
                                    <div class="task-main">
                                        <div
                                            class="grip"
                                            role="img"
                                            aria-label="Drag to reorder"
                                            onPointerDown=${(e) => onGripDown(e, task.id)}
                                            onPointerMove=${onGripMove}
                                            onPointerUp=${onGripUp}
                                            onPointerCancel=${onGripUp}
                                        >
                                            <${Icon} name="GripVertical" size=${16} />
                                        </div>
                                        <input type="text" class=${'input task-name' + (isCompleted ? ' struck' : '')} value=${task.name}
                                            placeholder="Task Name" aria-label="Step name"
                                            onInput=${(e) => updateTask(task.id, 'name', e.target.value)} />
                                        <div class="dur">
                                            <input type="number" min="0" inputmode="numeric" class="input" value=${task.duration}
                                                aria-label=${`Minutes for ${name}`}
                                                onInput=${(e) => updateTask(task.id, 'duration', parseInt(e.target.value) || 0)} />
                                            <span aria-hidden="true">min</span>
                                        </div>
                                    </div>
                                    <div class="task-actions">
                                        <div class="tools">
                                            <button class="icon-btn" onClick=${() => moveTask(index, -1)} aria-label=${`Move ${name} up`}><${Icon} name="ArrowUp" size=${14} /></button>
                                            <button class="icon-btn" onClick=${() => moveTask(index, 1)} aria-label=${`Move ${name} down`}><${Icon} name="ArrowDown" size=${14} /></button>
                                            <button class="icon-btn danger" onClick=${() => deleteTask(task.id)} aria-label=${`Delete ${name}`}><${Icon} name="Trash2" size=${14} /></button>
                                        </div>
                                        ${task.status === 'pending' && html`<button class="act start" onClick=${() => setTaskStatus(task.id, 'active')}><${Icon} name="Play" size=${12} /> Start</button>`}
                                        ${isActive && html`<button class="act finish" onClick=${() => setTaskStatus(task.id, 'completed')}><${Icon} name="Check" size=${12} /> Done</button>`}
                                        ${isCompleted && html`<button class="act restart" onClick=${() => setTaskStatus(task.id, 'pending')}><${Icon} name="RotateCcw" size=${12} /> Restart</button>`}
                                    </div>
                                </div>
                            `;
                        })}
                    </div>
                    <button class="add" onClick=${addTask}>
                        <${Icon} name="Plus" size=${18} /> Add Task Step
                    </button>
                    <div class="footer">Changes auto-saved to device</div>
                </div>
            `;
        };

        render(html`<${App} />`, document.getElementById('root'));
    </script>
</body>
</html>
